<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL-X | Security Gateway & Platform Selection | SIH 2026 PS-26223</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: '#030712',
                            dark: '#0B0F19',
                            blue: '#0F52BA',
                            neonBlue: '#3B82F6',
                            neonGreen: '#10B981',
                            neonRed: '#EF4444',
                            orange: '#F59E0B',
                            glass: 'rgba(15, 23, 42, 0.6)'
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #030712;
            background-image: radial-gradient(circle at top right, rgba(30, 58, 138, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(8, 145, 178, 0.1), transparent 40%);
            color: #F3F4F6;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(11, 15, 25, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
        }
        @keyframes scan {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .laser-scan::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(59, 130, 246, 0.6);
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
            animation: scan 4s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 select-none">

    <!-- Auth Frame Container -->
    <div class="w-full max-w-lg relative">
        <!-- Background Glowing Circles -->
        <div class="absolute -top-12 -left-12 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-12 -right-12 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl"></div>

        <!-- card -->
        <div class="glass-card rounded-2xl p-8 border border-white/10 relative overflow-hidden laser-scan shadow-2xl">
            
            <!-- Card Header -->
            <div class="text-center space-y-3 pb-5 border-b border-white/5">
                <div id="brand-icon-box" class="inline-flex w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-700 to-cyan-500 items-center justify-center border border-white/10 shadow-lg shadow-blue-500/20">
                    <i id="brand-icon" data-lucide="shield-alert" class="w-6 h-6 text-white"></i>
                </div>
                <h2 id="gate-title" class="text-2xl font-extrabold tracking-wider text-white">SENTINEL-X SECURITY GATE</h2>
                <p id="gate-subtitle" class="text-xs uppercase tracking-widest text-cyan-400 font-bold">EDGE DISASTER & SAFETY AUTHENTICATION GATEWAY</p>
            </div>

            <!-- Login View -->
            <div id="login-view" class="pt-5 space-y-5">
                
                <!-- OPERATIONAL MODE SELECTOR (ISOLATION LAYER) -->
                <div class="space-y-1.5">
                    <label class="text-[11px] uppercase tracking-wider font-bold text-slate-300">Choose Operational Platform</label>
                    <div class="grid grid-cols-2 gap-2.5 p-1 bg-black/40 rounded-xl border border-white/10" id="platform-mode-selector">
                        <button type="button" onclick="selectMode('civilian')" id="btn-mode-civilian" class="py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-all border border-transparent text-slate-400 hover:text-white">
                            <i data-lucide="siren" class="w-4 h-4 text-rose-400"></i>
                            <span>CIVILIAN (AI UC)</span>
                        </button>
                        <button type="button" onclick="selectMode('industrial')" id="btn-mode-industrial" class="py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-all border border-blue-500/40 bg-blue-600/20 text-white shadow-md shadow-blue-500/20">
                            <i data-lucide="factory" class="w-4 h-4 text-cyan-400"></i>
                            <span>INDUSTRIAL (SCADA)</span>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Role Selector -->
                <div class="space-y-2">
                    <label id="role-selector-label" class="text-xs uppercase tracking-wider font-bold text-slate-300">Select Security Profile Role</label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2" id="role-selector">
                        <!-- Populated by JavaScript according to active mode -->
                    </div>
                </div>

                <!-- Input fields -->
                <form id="credentials-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                    <div class="space-y-2">
                        <label for="email" class="text-xs uppercase tracking-wider font-bold text-slate-300">Security Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i data-lucide="mail" class="w-4.5 h-4.5"></i>
                            </span>
                            <input type="email" id="email" required placeholder="name@sentinel.x" class="w-full bg-brand-black/60 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all font-mono">
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label for="password" class="text-xs uppercase tracking-wider font-bold text-slate-300">Security Authorization Key</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                                <i data-lucide="key-round" class="w-4.5 h-4.5"></i>
                            </span>
                            <input type="password" id="password" required placeholder="••••••••••••" value="demo-access-2026" class="w-full bg-brand-black/60 border border-white/10 rounded-xl py-3 pl-11 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50 transition-all font-mono">
                        </div>
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full py-3.5 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/20 border border-white/10 flex items-center justify-center gap-2 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        <i data-lucide="log-in" class="w-4.5 h-4.5"></i>
                        <span>Initiate Secure Authentication</span>
                    </button>
                </form>
            </div>

            <!-- OTP Verification View -->
            <div id="otp-view" class="pt-6 space-y-6 hidden">
                <div class="text-center space-y-2 bg-blue-500/10 border border-blue-500/20 rounded-xl p-4">
                    <p class="text-sm text-slate-200 leading-normal">
                        Security Token sent to <span id="sent-email" class="font-mono text-cyan-400">email</span>
                    </p>
                    <p class="text-xs text-slate-300 font-mono">
                        Enter Code: <span id="hint-code" class="font-bold text-emerald-400">000000</span> (Pre-Filled)
                    </p>
                </div>

                <div class="space-y-4">
                    <!-- OTP Boxes -->
                    <div class="flex justify-between gap-2 max-w-xs mx-auto" id="otp-inputs">
                        <input type="text" maxlength="1" aria-label="Digit 1" oninput="moveNext(this, 1)" class="otp-box w-12 h-12 bg-brand-black/60 border border-white/10 rounded-xl text-center text-xl font-bold font-mono text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50">
                        <input type="text" maxlength="1" aria-label="Digit 2" oninput="moveNext(this, 2)" class="otp-box w-12 h-12 bg-brand-black/60 border border-white/10 rounded-xl text-center text-xl font-bold font-mono text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50">
                        <input type="text" maxlength="1" aria-label="Digit 3" oninput="moveNext(this, 3)" class="otp-box w-12 h-12 bg-brand-black/60 border border-white/10 rounded-xl text-center text-xl font-bold font-mono text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50">
                        <input type="text" maxlength="1" aria-label="Digit 4" oninput="moveNext(this, 4)" class="otp-box w-12 h-12 bg-brand-black/60 border border-white/10 rounded-xl text-center text-xl font-bold font-mono text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50">
                        <input type="text" maxlength="1" aria-label="Digit 5" oninput="moveNext(this, 5)" class="otp-box w-12 h-12 bg-brand-black/60 border border-white/10 rounded-xl text-center text-xl font-bold font-mono text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50">
                        <input type="text" maxlength="1" aria-label="Digit 6" oninput="moveNext(this, 6)" class="otp-box w-12 h-12 bg-brand-black/60 border border-white/10 rounded-xl text-center text-xl font-bold font-mono text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/50">
                    </div>

                    <button onclick="verifyOtp()" id="verify-token-btn" class="w-full py-4 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-blue-600 to-cyan-600 hover:from-blue-700 hover:to-cyan-700 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/20 border border-white/10 flex items-center justify-center gap-2 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-cyan-500">
                        <i data-lucide="shield-check" class="w-4.5 h-4.5"></i>
                        <span>Verify Security Token</span>
                    </button>

                    <div class="flex items-center justify-between text-xs text-slate-300 px-2 font-mono" aria-live="polite">
                        <div class="flex items-center gap-1.5">
                            <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                            <span>Resend in <span id="timer" class="font-bold text-blue-400">60</span>s</span>
                        </div>
                        <button onclick="resendOtp()" id="resend-btn" disabled class="text-slate-400 hover:text-blue-400 transition-colors disabled:cursor-not-allowed disabled:opacity-50">Resend OTP</button>
                    </div>
                </div>
            </div>

            <!-- Loading & Access Granted HUD View -->
            <div id="loading-view" class="pt-6 pb-4 space-y-5 text-center hidden">
                <div class="inline-flex w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-500/40 items-center justify-center text-emerald-400 mx-auto">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>

                <div class="space-y-1">
                    <div class="text-xs font-mono font-bold tracking-widest text-emerald-400 uppercase">AUTHENTICATION VERIFIED</div>
                    <h3 class="text-xl font-display font-extrabold text-white tracking-wider">PLATFORM ACCESS GRANTED</h3>
                    <p id="granted-subtitle" class="text-xs text-cyan-400 font-mono font-semibold">SESSION INITIALIZED &bull; SYSTEMS SYNCHRONIZED</p>
                </div>

                <!-- Telemetry Checklist -->
                <div class="p-4 rounded-xl bg-slate-900/90 border border-white/10 text-left font-mono text-xs space-y-2 max-w-sm mx-auto" id="checklist-box">
                    <!-- Filled dynamically -->
                </div>

                <!-- Direct Access Button -->
                <button onclick="navigateToConsole()" id="enter-platform-btn" class="w-full py-3.5 rounded-xl text-sm font-bold text-white bg-gradient-to-r from-emerald-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 transition-all duration-300 hover:shadow-lg hover:shadow-emerald-500/20 border border-emerald-400/40 flex items-center justify-center gap-2 active:scale-95 cursor-pointer">
                    <i data-lucide="external-link" class="w-4 h-4"></i>
                    <span id="enter-btn-label">ENTER OPERATIONAL PLATFORM →</span>
                </button>
            </div>

            <!-- Footer Return Link -->
            <div class="pt-4 border-t border-white/5 text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:text-slate-200 transition-colors font-mono inline-flex items-center gap-1.5">
                    <span>←</span>
                    <span>Return to Public Website</span>
                </a>
            </div>

        </div>
    </div>

    <script>
        if (window.lucide) lucide.createIcons();

        let currentMode = "industrial"; // 'industrial' or 'civilian'
        let currentRole = "Admin";
        let currentEmail = "admin@sentinel.x";
        let currentOtp = "094821";
        let timerVal = 60;
        let countdownTimer;

        // Enterprise Multi-Role Matrix (Sections 2 & 19)
        const INDUSTRIAL_ROLES = [
            { role: 'Worker', email: 'worker@sentinel.x', otp: '201948', icon: 'hard-hat', color: 'text-amber-400', desc: 'Personal Safety & SOS' },
            { role: 'Supervisor', email: 'supervisor@sentinel.x', otp: '384912', icon: 'users', color: 'text-cyan-400', desc: 'Team & Area Control' },
            { role: 'Admin', email: 'admin@sentinel.x', otp: '094821', icon: 'user-cog', color: 'text-blue-400', desc: 'Full System Control' },
            { role: 'Owner', email: 'owner@sentinel.x', otp: '518492', icon: 'briefcase', color: 'text-purple-400', desc: 'Executive Facility View' },
            { role: 'Coordinator', email: 'coordinator@sentinel.x', otp: '741928', icon: 'share-2', color: 'text-emerald-400', desc: 'Emergency Coordination' }
        ];

        const CIVILIAN_ROLES = [
            { role: 'Citizen', email: 'citizen@sentinel.x', otp: '108001', icon: 'user', color: 'text-emerald-400', desc: '1-Tap Distress SOS' },
            { role: 'CAD Dispatcher', email: 'dispatcher@sentinel.x', otp: '719402', icon: 'headset', color: 'text-rose-400', desc: 'Triage & Unit Dispatch' },
            { role: 'Incident Commander', email: 'commander@sentinel.x', otp: '948123', icon: 'shield-alert', color: 'text-amber-400', desc: 'Multi-Agency Leader' },
            { role: 'Paramedic Lead', email: 'paramedic@sentinel.x', otp: '528194', icon: 'ambulance', color: 'text-cyan-400', desc: 'ALS Vehicle Crew' },
            { role: 'Trauma Physician', email: 'physician@sentinel.x', otp: '381947', icon: 'cross', color: 'text-blue-400', desc: 'Hospital Receiving Bay' }
        ];

        // Mode Switching
        function selectMode(mode) {
            currentMode = mode;
            const btnCivilian = document.getElementById('btn-mode-civilian');
            const btnIndustrial = document.getElementById('btn-mode-industrial');
            const gateTitle = document.getElementById('gate-title');
            const gateSubtitle = document.getElementById('gate-subtitle');
            const brandBox = document.getElementById('brand-icon-box');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (mode === 'civilian') {
                btnCivilian.className = "py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-all border border-rose-500/50 bg-rose-600/25 text-white shadow-md shadow-rose-500/25";
                btnIndustrial.className = "py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-all border border-transparent text-slate-400 hover:text-white";
                
                gateTitle.textContent = "SENTINEL-X CIVILIAN GATE";
                gateSubtitle.textContent = "AI EMERGENCY RESPONSE AUTHENTICATION (UC)";
                gateSubtitle.className = "text-xs uppercase tracking-widest text-rose-400 font-bold";
                brandBox.className = "inline-flex w-12 h-12 rounded-xl bg-gradient-to-tr from-rose-700 to-amber-500 items-center justify-center border border-white/10 shadow-lg shadow-rose-500/20";
                submitBtn.className = "w-full py-3.5 rounded-xl text-sm font-bold text-white bg-rose-600 hover:bg-rose-700 transition-all duration-300 hover:shadow-lg hover:shadow-rose-500/20 border border-white/10 flex items-center justify-center gap-2 active:scale-95";

                renderRoleButtons(CIVILIAN_ROLES);
                selectRole('CAD Dispatcher', 'dispatcher@sentinel.x', '719402');
            } else {
                btnIndustrial.className = "py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-all border border-blue-500/40 bg-blue-600/20 text-white shadow-md shadow-blue-500/20";
                btnCivilian.className = "py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 transition-all border border-transparent text-slate-400 hover:text-white";

                gateTitle.textContent = "SENTINEL-X SECURITY GATE";
                gateSubtitle.textContent = "EDGE DISASTER & SAFETY AUTHENTICATION GATEWAY";
                gateSubtitle.className = "text-xs uppercase tracking-widest text-cyan-400 font-bold";
                brandBox.className = "inline-flex w-12 h-12 rounded-xl bg-gradient-to-tr from-blue-700 to-cyan-500 items-center justify-center border border-white/10 shadow-lg shadow-blue-500/20";
                submitBtn.className = "w-full py-3.5 rounded-xl text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all duration-300 hover:shadow-lg hover:shadow-blue-500/20 border border-white/10 flex items-center justify-center gap-2 active:scale-95";

                renderRoleButtons(INDUSTRIAL_ROLES);
                selectRole('Admin', 'admin@sentinel.x', '094821');
            }
            if (window.lucide) lucide.createIcons();
        }

        function renderRoleButtons(roles) {
            const container = document.getElementById('role-selector');
            container.innerHTML = '';
            roles.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "role-btn px-3 py-2.5 rounded-xl border border-white/10 bg-white/5 text-slate-200 hover:border-white/20 transition-all text-xs font-semibold flex items-center gap-2 active:scale-95";
                btn.onclick = () => selectRole(item.role, item.email, item.otp);
                btn.innerHTML = `<i data-lucide="${item.icon}" class="w-4 h-4 ${item.color}"></i><span>${item.role}</span>`;
                container.appendChild(btn);
            });
        }

        // Handle Role selection
        function selectRole(role, email, mockOtp) {
            currentRole = role;
            currentEmail = email;
            currentOtp = mockOtp;
            
            const buttons = document.querySelectorAll('.role-btn');
            buttons.forEach(btn => {
                if (btn.innerText.includes(role)) {
                    btn.classList.add('border-emerald-500/60', 'bg-emerald-500/10', 'text-white');
                    btn.classList.remove('border-white/10', 'bg-white/5', 'text-slate-200');
                } else {
                    btn.classList.remove('border-emerald-500/60', 'bg-emerald-500/10', 'text-white');
                    btn.classList.add('border-white/10', 'bg-white/5', 'text-slate-200');
                }
            });

            const emailInp = document.getElementById('email');
            if (emailInp) emailInp.value = email;
        }

        // Handle Credentials Submit
        function handleLoginSubmit(event) {
            if (event && event.preventDefault) event.preventDefault();
            const emailInput = document.getElementById('email');
            const email = emailInput && emailInput.value ? emailInput.value : currentEmail;

            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('loading-view').classList.add('hidden');
            const otpView = document.getElementById('otp-view');
            if (otpView) otpView.classList.remove('hidden');

            const sentEmailEl = document.getElementById('sent-email');
            if (sentEmailEl) sentEmailEl.innerText = email;

            const hintCodeEl = document.getElementById('hint-code');
            if (hintCodeEl) hintCodeEl.innerText = currentOtp || '094821';

            const boxes = document.querySelectorAll('.otp-box');
            const otpStr = String(currentOtp || '094821');
            for (let i = 0; i < boxes.length && i < otpStr.length; i++) {
                boxes[i].value = otpStr[i];
            }

            startTimer();
            if (window.lucide) lucide.createIcons();
        }

        function moveNext(input, index) {
            if (input.value.length === 1 && index < 6) {
                const nextInput = document.getElementById('otp-inputs').children[index];
                if (nextInput) nextInput.focus();
            }
        }

        function startTimer() {
            timerVal = 60;
            const timerEl = document.getElementById('timer');
            if (timerEl) timerEl.innerText = timerVal;
            const resendBtn = document.getElementById('resend-btn');
            if (resendBtn) {
                resendBtn.disabled = true;
                resendBtn.classList.remove('text-blue-400');
                resendBtn.classList.add('text-slate-500');
            }

            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timerVal--;
                if (timerEl) timerEl.innerText = timerVal;
                if (timerVal <= 0) {
                    clearInterval(countdownTimer);
                    if (resendBtn) {
                        resendBtn.disabled = false;
                        resendBtn.classList.add('text-blue-400');
                        resendBtn.classList.remove('text-slate-500');
                    }
                }
            }, 1000);
        }

        function resendOtp() {
            startTimer();
        }

        // Global Navigation to Selected Operational Console
        function navigateToConsole() {
            sessionStorage.setItem("authenticated", "true");
            sessionStorage.setItem("userRole", currentRole || "Admin");
            const emailEl = document.getElementById('email');
            sessionStorage.setItem("userEmail", emailEl && emailEl.value ? emailEl.value : currentEmail);
            sessionStorage.setItem("userName", (currentRole || "Admin") + " User");
            sessionStorage.setItem("operationalMode", currentMode);

            if (currentMode === "civilian") {
                if (currentRole === 'Citizen') {
                    window.location.href = "civilian/index.html?view=citizen";
                } else {
                    window.location.href = "civilian/index.html?view=dispatcher";
                }
            } else {
                window.location.href = "app.html";
            }
        }

        // Verify OTP
        function verifyOtp() {
            const boxes = document.querySelectorAll('.otp-box');
            let code = "";
            boxes.forEach(box => { code += box.value; });

            if (!code || code.length === 0) code = currentOtp || "094821";

            if (code === currentOtp || code === "942861" || code === "094821" || code.length === 6) {
                document.getElementById('otp-view').classList.add('hidden');
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('loading-view').classList.remove('hidden');

                const checkList = document.getElementById('checklist-box');
                const enterLabel = document.getElementById('enter-btn-label');
                const grantedSub = document.getElementById('granted-subtitle');

                if (currentMode === 'civilian') {
                    grantedSub.textContent = "CAD EMERGENCY BUS INITIALIZED • AI TRIAGE READY";
                    enterLabel.textContent = "ENTER CIVILIAN EMERGENCY PLATFORM →";
                    checkList.innerHTML = `
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">DOMAIN:</span>
                            <span class="font-bold text-rose-400">CIVILIAN EMERGENCY RESPONSE</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">CAD INTAKE BUS:</span>
                            <span class="text-emerald-400 font-bold">ONLINE</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">CLINICAL AI TRIAGE:</span>
                            <span class="text-cyan-400 font-bold">SYNCHRONIZED</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">FLEET GPS PREEMPTION:</span>
                            <span class="text-emerald-400 font-bold">ACTIVE</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">HOSPITAL HL7/FHIR:</span>
                            <span class="text-emerald-400 font-bold">CONNECTED</span>
                        </div>
                    `;
                } else {
                    grantedSub.textContent = "EDGE SESSION INITIALIZED • DIGITAL TWIN SYNCHRONIZED";
                    enterLabel.textContent = "ENTER INDUSTRIAL CONTROL ROOM →";
                    checkList.innerHTML = `
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">FACILITY:</span>
                            <span class="font-bold text-white">INDUSTRIAL UNIT 01</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">EDGE NETWORK:</span>
                            <span class="text-emerald-400 font-bold">2/2 ONLINE</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">TELEMETRY BUS:</span>
                            <span class="text-cyan-400 font-bold">CONNECTED</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">SAFETY ENGINE:</span>
                            <span class="text-emerald-400 font-bold">ACTIVE</span>
                        </div>
                        <div class="flex justify-between items-center text-slate-300">
                            <span class="text-slate-400">DIGITAL TWIN:</span>
                            <span class="text-emerald-400 font-bold">SYNCHRONIZED</span>
                        </div>
                    `;
                }

                if (window.lucide) lucide.createIcons();

                setTimeout(() => {
                    navigateToConsole();
                }, 850);
            } else {
                alert("Security Authorization Code Mismatch. Please check the prefilled code.");
            }
        }

        // On Load: Check URL parameter ?mode=civilian or ?mode=industrial
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');
            if (mode === 'civilian') {
                selectMode('civilian');
            } else {
                selectMode('industrial');
            }
        });
    </script>
